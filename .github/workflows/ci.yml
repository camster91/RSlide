name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.12.0, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --engine-strict
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: |
          # Test-only settings (read at build time): webhooks to this machine, and sign-in links in responses. Never set these in production.
          printf 'WEBHOOK_ALLOW_PRIVATE="1"\nAUTH_DEV_LINKS="1"\nOIDC_ISSUER="http://127.0.0.1:9911"\nOIDC_CLIENT_ID="rslide-test"\nOIDC_CLIENT_SECRET="test-secret"\nOIDC_NAME="Test SSO"\nOIDC_ALLOWED_DOMAINS="example.com"\n' > .dev.vars
          npm run build
      - name: Start app
        run: |
          npx vite preview --port 8787 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/ > /dev/null && break; sleep 1; done
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Load test (2,000 attendees)
        run: |
          ulimit -n 65536 || true
          npm run test:load -- 2000
      - name: Server log
        if: failure()
        run: cat preview.log
