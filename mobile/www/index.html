<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No connection</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #3b3fd8; color: #fff; }
      main { min-height: 100%; display: grid; place-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: 0; opacity: 0.9; line-height: 1.5; }
      button { justify-self: center; font: inherit; font-weight: 700; padding: 14px 28px; border-radius: 999px; border: 0; background: #ffb21a; color: #1b1400; min-height: 48px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="t">You're offline</h1>
      <p id="m">Check your Wi-Fi or mobile data, then try again.</p>
      <button id="b" type="button">Try again</button>
    </main>
    <script>
      var L = (navigator.language || "en").slice(0, 2);
      var T = {
        fr: ["Vous êtes hors ligne", "Vérifiez votre Wi-Fi ou vos données mobiles, puis réessayez.", "Réessayer"],
        es: ["Estás sin conexión", "Revisa tu Wi-Fi o tus datos móviles y vuelve a intentarlo.", "Reintentar"],
      }[L];
      if (T) { document.documentElement.lang = L; t.textContent = T[0]; m.textContent = T[1]; b.textContent = T[2]; }
      // Go back to the site: Capacitor keeps the server address, so reloading the start page works.
      b.onclick = function () { location.href = "/"; };
      addEventListener("online", function () { location.href = "/"; });
    </script>
  </body>
</html>
